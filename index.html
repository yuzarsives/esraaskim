<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Esra & Yusuf 🥀 Bizim Köşemiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #1a050a;
      --bg-burgundy: #2d0a12;
      --card-burgundy: rgba(58, 13, 24, 0.88);
      --beige-light: #f5ebe0;
      --beige-warm: #e3d5ca;
      --beige-muted: #d5bdaf;
      --accent-rose: #9e2a47;
    }
    body {
      background: radial-gradient(circle at top, #3d0c18 0%, #1a050a 70%, #110206 100%);
      color: var(--beige-light);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .serif-title { font-family: 'Playfair Display', serif; }
    .burgundy-card {
      background: var(--card-burgundy);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(227, 213, 202, 0.18);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
    }
    .beige-btn {
      background: linear-gradient(135deg, #f5ebe0 0%, #d5bdaf 100%);
      color: #2d0a12;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .beige-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245, 235, 224, 0.25);
    }
    .burgundy-btn {
      background: linear-gradient(135deg, #801b34 0%, #520e1f 100%);
      color: #f5ebe0;
      border: 1px solid rgba(245, 235, 224, 0.25);
      transition: all 0.2s ease;
    }
    .burgundy-btn:hover {
      background: linear-gradient(135deg, #9e2a47 0%, #691429 100%);
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.9); opacity: 1; }
      100% { transform: translateY(-240px) scale(1.5); opacity: 0; }
    }
    .floating-item {
      position: fixed;
      bottom: 60px;
      font-size: 2.2rem;
      pointer-events: none;
      animation: floatUp 2.6s ease-out forwards;
      z-index: 999;
    }
    input[type="range"] { accent-color: #e3d5ca; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- GİRİŞ EKRANI -->
  <div id="loginModal" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="burgundy-card max-w-md w-full rounded-3xl p-7 text-center space-y-5 border border-[#e3d5ca]/30">
      <div class="text-4xl">🥀</div>
      <h1 class="serif-title text-3xl font-bold text-[#f5ebe0]">Esra & Yusuf</h1>
      <p class="text-xs text-[#d5bdaf] italic">"Mesafeler sadece sayılardan ibaret..."</p>

      <div class="pt-2">
        <label class="text-xs text-[#d5bdaf] block mb-2 font-semibold">Kim olarak bağlanıyorsun?</label>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="startApp('Yusuf')" class="beige-btn py-3.5 px-4 rounded-2xl flex flex-col items-center gap-1">
            <span class="text-2xl">👦🏻</span>
            <span class="text-sm font-bold">Yusuf</span>
          </button>
          <button onclick="startApp('Esra')" class="burgundy-btn py-3.5 px-4 rounded-2xl flex flex-col items-center gap-1">
            <span class="text-2xl">👧🏻</span>
            <span class="text-sm font-bold">Esra</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ÜST BAR -->
  <header class="burgundy-card px-5 py-3 flex flex-wrap items-center justify-between gap-3 border-b border-[#e3d5ca]/15">
    <div class="flex items-center gap-3">
      <span class="serif-title text-xl font-bold text-[#f5ebe0]">🥀 Esra & Yusuf</span>
      <span id="userBadge" class="text-xs bg-[#1a050a] text-[#e3d5ca] px-3 py-1 rounded-full border border-[#d5bdaf]/25">Bağlanıyor...</span>
      <span id="connStatus" class="text-xs px-3 py-1 rounded-full bg-amber-950 text-amber-300 border border-amber-600/30">⏳ Eşleşiliyor...</span>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="sendHug()" class="burgundy-btn px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1">
        🤗 Sarıl
      </button>
      <button onclick="sendRoseRain()" class="burgundy-btn px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1">
        🌹 Güller
      </button>
      <button onclick="openRandomNote()" class="beige-btn px-3 py-1.5 rounded-xl text-xs flex items-center gap-1">
        💌 Günün Notu
      </button>
    </div>
  </header>

  <!-- ANA SAHNE -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-4 p-4 max-w-7xl w-full mx-auto">

    <!-- SOL: VİDEO VE KUMANDA -->
    <div class="lg:col-span-2 flex flex-col gap-3">

      <!-- Link Barı -->
      <div class="burgundy-card p-3 rounded-2xl flex flex-wrap gap-2 items-center">
        <input id="videoUrlInput" type="text" placeholder="YouTube video linkini buraya yapıştır..." class="flex-1 min-w-[220px] bg-[#1a050a]/90 border border-[#d5bdaf]/25 rounded-xl px-3.5 py-2 text-sm text-[#f5ebe0] placeholder-[#d5bdaf]/50 focus:outline-none focus:border-[#f5ebe0]" />
        <button onclick="loadNewVideo()" class="beige-btn px-4 py-2 rounded-xl text-sm">
          🎬 Başlat
        </button>
      </div>

      <!-- Hazır Sahneler -->
      <div class="flex flex-wrap items-center gap-2 text-xs">
        <span class="text-[#d5bdaf]">✨ Önerilenler:</span>
        <button onclick="changeVideoById('jfKfPfyJRdk')" class="burgundy-btn px-2.5 py-1 rounded-lg">☕ Lo-Fi Gece</button>
        <button onclick="changeVideoById('5qap5aO4i9A')" class="burgundy-btn px-2.5 py-1 rounded-lg">🌧️ Yağmur</button>
        <button onclick="changeVideoById('LXb3EKWsInQ')" class="burgundy-btn px-2.5 py-1 rounded-lg">🌲 Doğa</button>
      </div>

      <!-- Video Oynatıcı -->
      <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-[#d5bdaf]/25 shadow-2xl">
        <div id="player" class="w-full h-full"></div>
      </div>

      <!-- Kumanda Barı -->
      <div class="burgundy-card p-4 rounded-2xl space-y-3">
        <div class="flex items-center gap-3">
          <span id="currentTimeText" class="text-xs font-mono text-[#d5bdaf] w-12">00:00</span>
          <input id="seekBar" type="range" min="0" max="100" value="0" step="1" onchange="onSeekBarChange(this.value)" oninput="onSeekBarDrag(this.value)" class="flex-1 h-2 bg-[#1a050a] rounded-lg cursor-pointer" />
          <span id="durationText" class="text-xs font-mono text-[#d5bdaf] w-12 text-right">00:00</span>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <button onclick="triggerPlay()" class="beige-btn px-4 py-2 rounded-xl text-xs">▶ Oynat</button>
            <button onclick="triggerPause()" class="burgundy-btn px-4 py-2 rounded-xl text-xs">⏸ Duraklat</button>
            <button onclick="seekRelative(-10)" class="burgundy-btn px-2.5 py-2 rounded-xl text-xs">⏪ -10sn</button>
            <button onclick="seekRelative(10)" class="burgundy-btn px-2.5 py-2 rounded-xl text-xs">+10sn ⏩</button>
          </div>

          <div class="flex items-center gap-2 text-xl bg-[#1a050a]/60 px-3 py-1 rounded-xl border border-[#d5bdaf]/15">
            <button onclick="sendReaction('❤️')" class="hover:scale-125 transition">❤️</button>
            <button onclick="sendReaction('🥺')" class="hover:scale-125 transition">🥺</button>
            <button onclick="sendReaction('🔥')" class="hover:scale-125 transition">🔥</button>
            <button onclick="sendReaction('😘')" class="hover:scale-125 transition">😘</button>
          </div>
        </div>

        <div class="text-[11px] text-[#d5bdaf]/80 border-t border-[#d5bdaf]/10 pt-2 text-center" id="actionStatus">
          Senkronize izleme aktif.
        </div>
      </div>

    </div>

    <!-- SAĞ: SOHBET -->
    <div class="burgundy-card rounded-2xl flex flex-col h-[520px] lg:h-auto overflow-hidden">
      <div class="p-3.5 border-b border-[#d5bdaf]/15 flex items-center justify-between">
        <span class="serif-title font-bold text-base text-[#f5ebe0]">💬 Sohbet</span>
        <span id="partnerStatus" class="text-xs text-[#d5bdaf]">Bekleniyor...</span>
      </div>

      <div id="chatBox" class="flex-1 p-3.5 overflow-y-auto space-y-2.5 text-sm">
        <div class="text-xs text-center text-[#d5bdaf]/70 italic my-2">
          Buradaki mesajlar ve video kontrolleri ikiniz arasında anlık eşleşir.
        </div>
      </div>

      <form onsubmit="sendChat(event)" class="p-3 border-t border-[#d5bdaf]/15 flex gap-2 bg-[#1a050a]/50">
        <input id="chatInput" type="text" placeholder="Mesaj yaz..." class="flex-1 bg-[#1a050a] border border-[#d5bdaf]/25 rounded-xl px-3.5 py-2 text-sm text-[#f5ebe0] focus:outline-none" />
        <button type="submit" class="beige-btn px-4 py-2 rounded-xl text-sm">Gönder</button>
      </form>
    </div>

  </main>

  <!-- ROMANTİK NOT / POPUP MODAL -->
  <div id="incomingPopup" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4">
    <div class="burgundy-card max-w-sm w-full rounded-3xl p-6 text-center space-y-4 border-2 border-[#f5ebe0]/40">
      <div id="popupIcon" class="text-5xl">💌</div>
      <h4 id="popupTitle" class="serif-title text-xl font-bold text-[#f5ebe0]">Günün Romantik Notu</h4>
      <p id="popupBody" class="text-sm text-[#e3d5ca] italic leading-relaxed"></p>
      <button onclick="document.getElementById('incomingPopup').classList.add('hidden')" class="beige-btn px-6 py-2 rounded-xl text-xs">❤️ Kalbime Yazdım</button>
    </div>
  </div>

  <script>
    let player, isPlayerReady = false;
    let currentVideoId = 'jfKfPfyJRdk';
    let myName = 'Yusuf';
    let peer = null, conn = null;
    let isRemoteAction = false, remoteTimer = null;

    const romanticQuotes = [
      "Gözlerine baktığımda tüm mesafelerin buhar olup uçtuğunu hissediyorum sevgilim.",
      "Dünyanın en güzel ekranı, seninle aynı videoyu izlerken koyu renkli sohbetimizin aktığı yerdir.",
      "İyi ki varsın, iyi ki bu dijital köşede bile ellerimiz birbirine değebiliyor.",
      "Sesini duyduğum an, en yorgun günüm bile en huzurlu anıma dönüşüyor.",
      "Uzaklarda olsak da kalbimin en başköşesinde sadece sen varsın.",
      "Seninle her saniye, ömrümün en değerli film şeridi gibi..."
    ];

    function lockRemote() {
      isRemoteAction = true;
      if (remoteTimer) clearTimeout(remoteTimer);
      remoteTimer = setTimeout(() => isRemoteAction = false, 900);
    }

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%', width: '100%',
        videoId: currentVideoId,
        host: 'https://www.youtube.com',
        playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1, playsinline: 1 },
        events: {
          onReady: () => { isPlayerReady = true; setInterval(updateProgressBar, 500); },
          onStateChange: onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(e) {
      if (isRemoteAction || !isPlayerReady) return;
      const t = player.getCurrentTime();
      if (e.data === YT.PlayerState.PLAYING) {
        sendToPartner({ type: 'SYNC_STATE', state: 'PLAY', time: t, sender: myName });
      } else if (e.data === YT.PlayerState.PAUSED) {
        sendToPartner({ type: 'SYNC_STATE', state: 'PAUSE', time: t, sender: myName });
      }
    }

    function startApp(selectedName) {
      myName = selectedName;
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('userBadge').innerText = myName;

      // Sabit ve kesintisiz bağlantı kimliği (Esra ve Yusuf için özel oda anahtarı)
      const roomKey = "esra-yusuf-özel-oda-2026";
      const myPeerId = myName === 'Yusuf' ? roomKey + "-yusuf" : roomKey + "-esra";
      const targetPeerId = myName === 'Yusuf' ? roomKey + "-esra" : roomKey + "-yusuf";

      peer = new Peer(myPeerId);

      peer.on('open', () => {
        setConnBadge('⏳ Diğer taraf bekleniyor...', 'amber');
        tryConnecting(targetPeerId);
      });

      peer.on('connection', (incomingConn) => {
        conn = incomingConn;
        setupConnectionEvents();
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          // Eğer ID çakışması olursa doğrudan bağlanmayı dene
          peer = new Peer();
          peer.on('open', () => {
            tryConnecting(targetPeerId);
          });
          peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            setupConnectionEvents();
          });
        }
      });
    }

    function tryConnecting(targetId) {
      const attempt = setInterval(() => {
        if (conn && conn.open) {
          clearInterval(attempt);
          return;
        }
        try {
          conn = peer.connect(targetId, { reliable: true });
          setupConnectionEvents();
        } catch(e) {}
      }, 1500);
    }

    function setupConnectionEvents() {
      if (!conn) return;
      conn.on('open', () => {
        setConnBadge('🟢 Bağlandı (Senkron Aktif)', 'green');
        document.getElementById('partnerStatus').innerText = '🟢 Çevrimiçi';
        addChat('Sistem', `💞 ${myName} odaya bağlandı, sinema aktif.`, true);
      });
      conn.on('data', data => handleData(data));
      conn.on('close', () => {
        setConnBadge('🔴 Bağlantı koptu', 'red');
        document.getElementById('partnerStatus').innerText = '🔴 Çevrimdışı';
      });
    }

    function sendToPartner(data) { if (conn && conn.open) conn.send(data); }

    function handleData(data) {
      if (!isPlayerReady) return;
      if (data.type === 'SYNC_STATE') {
        lockRemote();
        if (Math.abs(player.getCurrentTime() - data.time) > 1.0) player.seekTo(data.time, true);
        if (data.state === 'PLAY') player.playVideo();
        else player.pauseVideo();
      } else if (data.type === 'CHANGE_VIDEO') {
        lockRemote();
        currentVideoId = data.videoId;
        player.loadVideoById({ videoId: currentVideoId, startSeconds: data.time || 0 });
      } else if (data.type === 'CHAT') {
        addChat(data.sender, data.text, false);
      } else if (data.type === 'REACTION') {
        spawnEmoji(data.emoji);
      } else if (data.type === 'ROSE') {
        triggerRoses();
      } else if (data.type === 'HUG') {
        showPopup('🤗', 'Sımsıkı Sarılma', `"${data.sender} sana sımsıkı sarıldı..."`);
        spawnEmoji('🤗');
      }
    }

    function triggerPlay() {
      if (!isPlayerReady) return;
      lockRemote(); player.playVideo();
      sendToPartner({ type: 'SYNC_STATE', state: 'PLAY', time: player.getCurrentTime(), sender: myName });
    }

    function triggerPause() {
      if (!isPlayerReady) return;
      lockRemote(); player.pauseVideo();
      sendToPartner({ type: 'SYNC_STATE', state: 'PAUSE', time: player.getCurrentTime(), sender: myName });
    }

    function seekRelative(sec) {
      if (!isPlayerReady) return;
      const t = Math.max(0, player.getCurrentTime() + sec);
      lockRemote(); player.seekTo(t, true);
      sendToPartner({ type: 'SYNC_STATE', state: 'PLAY', time: t, sender: myName });
    }

    let isDragging = false;
    function onSeekBarDrag(v) { isDragging = true; document.getElementById('currentTimeText').innerText = formatTime(v); }
    function onSeekBarChange(v) {
      isDragging = false;
      if (!isPlayerReady) return;
      lockRemote(); player.seekTo(parseFloat(v), true);
      sendToPartner({ type: 'SYNC_STATE', state: 'PLAY', time: parseFloat(v), sender: myName });
    }

    function updateProgressBar() {
      if (!isPlayerReady || isDragging) return;
      const c = player.getCurrentTime() || 0, d = player.getDuration() || 0;
      const bar = document.getElementById('seekBar');
      if (d > 0) {
        bar.max = Math.floor(d); bar.value = Math.floor(c);
        document.getElementById('currentTimeText').innerText = formatTime(c);
        document.getElementById('durationText').innerText = formatTime(d);
      }
    }

    function loadNewVideo() {
      const raw = document.getElementById('videoUrlInput').value.trim();
      const match = raw.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/);
      const vid = (match && match[2].length === 11) ? match[2] : (raw.length === 11 ? raw : null);
      if (!vid) { alert('Geçerli bir YouTube linki girin.'); return; }
      changeVideoById(vid);
      document.getElementById('videoUrlInput').value = '';
    }

    function changeVideoById(vid) {
      if (!isPlayerReady) return;
      currentVideoId = vid;
      lockRemote(); player.loadVideoById(vid);
      sendToPartner({ type: 'CHANGE_VIDEO', videoId: vid, time: 0, state: 'PLAY', sender: myName });
    }

    function sendChat(e) {
      e.preventDefault();
      const inp = document.getElementById('chatInput');
      const text = inp.value.trim();
      if (!text) return;
      addChat(myName, text, false);
      sendToPartner({ type: 'CHAT', sender: myName, text: text });
      inp.value = '';
    }

    function addChat(sender, text, isSys) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      if (isSys) {
        div.className = "text-xs text-center text-[#e3d5ca] bg-[#1a050a]/60 py-1 px-3 rounded-full my-1";
        div.innerText = text;
      } else {
        const isMe = sender === myName;
        div.className = `p-2.5 rounded-2xl max-w-[82%] ${isMe ? 'bg-gradient-to-r from-[#801b34] to-[#520e1f] text-[#f5ebe0] ml-auto' : 'bg-[#1a050a]/90 text-[#f5ebe0] mr-auto'}`;
        div.innerHTML = `<div class="text-[10px] font-bold text-[#d5bdaf] mb-0.5">${sender}</div><div>${text}</div>`;
      }
      box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    function sendReaction(emoji) {
      spawnEmoji(emoji);
      sendToPartner({ type: 'REACTION', emoji: emoji });
    }

    function spawnEmoji(emoji) {
      const el = document.createElement('div');
      el.className = 'floating-item'; el.innerText = emoji;
      el.style.left = Math.floor(Math.random() * 80 + 10) + '%';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }

    function sendRoseRain() {
      triggerRoses();
      sendToPartner({ type: 'ROSE' });
    }

    function triggerRoses() {
      ['🌹', '🥀', '❤️', '✨'].forEach((item, idx) => {
        setTimeout(() => spawnEmoji(item), idx * 150);
      });
    }

    function sendHug() {
      spawnEmoji('🤗');
      sendToPartner({ type: 'HUG', sender: myName });
    }

    function openRandomNote() {
      const randomQuote = romanticQuotes[Math.floor(Math.random() * romanticQuotes.length)];
      showPopup('💌', 'Günün Romantik Notu', `"${randomQuote}"`);
      triggerRoses();
    }

    function showPopup(icon, title, body) {
      document.getElementById('popupIcon').innerText = icon;
      document.getElementById('popupTitle').innerText = title;
      document.getElementById('popupBody').innerText = body;
      document.getElementById('incomingPopup').classList.remove('hidden');
    }

    function setConnBadge(text, type) {
      const el = document.getElementById('connStatus');
      el.innerText = text;
      el.className = `text-xs px-3 py-1 rounded-full ${type === 'green' ? 'bg-emerald-950 text-emerald-300 border border-emerald-500/40' : type === 'red' ? 'bg-rose-950 text-rose-300 border border-rose-500/40' : 'bg-amber-950 text-amber-300 border border-amber-600/30'}`;
    }

    function formatTime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      return `${Math.floor(sec / 60).toString().padStart(2, '0')}:${(sec % 60).toString().padStart(2, '0')}`;
    }
  </script>
</body>
</html>
